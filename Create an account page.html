
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Soko Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: #f5f3e9;
            color: #183b2b;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #176b45;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .description {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8ded8;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #176b45;
            box-shadow: 0 0 0 2px rgba(23, 107, 69, 0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #176b45;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 20px 0;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms a,
        .signin a {
            color: #176b45;
            font-weight: bold;
            text-decoration: none;
        }

        .create-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #176b45;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .create-btn:hover {
            background: #105536;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .signin {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #666;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #777;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">Soko Hub</div>
        <p class="subtitle">Your campus marketplace</p>

        <h2>Create your account</h2>
        <p class="description">
            Join Soko Hub and connect with service providers.
        </p>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="e.g. 0712345678"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword('password', this)"
                    >Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >Show</button>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" id="agreeTerms" required>
                <span>
                    I agree to the
                    <a href="terms.html">Terms and Conditions</a>
                    and
                    <a href="privacy.html">Privacy Policy</a>.
                </span>
            </label>

            <button type="submit" class="create-btn">
                Create Account
            </button>

            <p id="message" class="message" role="status"></p>
        </form>

        <p class="signin">
            Already have an account?
            <a href="soko-hub-auth.html">Sign in</a>
        </p>

        <a href="index.html" class="back-home">
            ← Back to home
        </a>
    </main>

    <script>
        function togglePassword(id, button) {
            const input = document.getElementById(id);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Hide";
            } else {
                input.type = "password";
                button.textContent = "Show";
            }
        }

        document.getElementById("registerForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const fullName =
                    document.getElementById("fullName").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const message =
                    document.getElementById("message");

                message.style.color = "#c0392b";

                if (!fullName || !email || !phone) {
                    message.textContent =
                        "Please complete all required fields.";
                    return;
                }

                if (password.length < 8) {
                    message.textContent =
                        "Your password must have at least 8 characters.";
                    return;
                }

                if (password !== confirmPassword) {
                    message.textContent =
                        "Your passwords do not match.";
                    return;
                }

                if (!document.getElementById("agreeTerms").checked) {
                    message.textContent =
                        "Please agree to the Terms and Conditions.";
                    return;
                }

                message.style.color = "#176b45";
                message.textContent =
                    "Form validated! Account creation will work once authentication is connected.";
            }
        );
    </script>
</body>
</html>
